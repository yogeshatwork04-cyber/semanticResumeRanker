services:
  db:
    image: postgres:16-alpine
    container_name: resume_matcher_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: resume_matcher
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resume_matcher"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume_matcher_backend
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/resume_matcher
      - DEBUG=false
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: resume_matcher_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
